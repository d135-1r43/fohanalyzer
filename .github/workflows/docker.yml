# Builds the site image and pushes it to the GitHub Container Registry.
#
# Pull requests build but do not push, so a broken Dockerfile is caught before
# it reaches a tag. Pushes to main publish :main and :sha-<commit>; a semver
# tag publishes :1.2.3, :1.2, :1 and :latest.
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Verify the server block parses before an image built around it is
      # published. `nginx -t` wants the file in place, so mount it where the
      # image expects it and let the container's own nginx check it.
      - name: Validate the nginx config
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.29-alpine nginx -t

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Built for this runner's architecture only and loaded into the local
      # daemon, because a multi-platform build produces a manifest list that
      # `docker run` cannot start. The layers are cached, so the push build
      # below reuses this work rather than repeating it.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fohanalyzer-site:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A published image that does not serve is worse than one that never
      # shipped. Boot it and check the real URLs come back.
      - name: Smoke-test the image
        run: |
          docker run -d --name site -p 8080:8080 fohanalyzer-site:test
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz > /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8080/                      > /dev/null
          curl -fsS http://localhost:8080/contribute            > /dev/null
          curl -fsS http://localhost:8080/contribute.html       > /dev/null
          curl -fsS http://localhost:8080/impressum             > /dev/null
          # The Impressum is legally required to stay reachable — fail loudly
          # if it ever stops being served or loses its address block.
          curl -fsS http://localhost:8080/impressum.html | grep -q "Scheyerer"
          curl -fsS http://localhost:8080/assets/css/tokens.css > /dev/null
          curl -fsS http://localhost:8080/assets/js/components.js > /dev/null
          curl -fsS http://localhost:8080/assets/fonts/Barlow-Regular.woff2 > /dev/null
          # A missing page must 404, not fall through to the index.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope)" = "404"
          # The CSP header has to survive the location blocks that serve assets.
          curl -sI http://localhost:8080/assets/css/base.css | grep -qi 'content-security-policy'
          docker logs site
          # The Impressum promises truncated IPs in the access log. Prove it:
          # the client is 172.17.0.1, so nothing but 172.17.0.0 may be logged.
          docker logs site 2>&1 | grep -q '^172\.17\.0\.0 '
          if docker logs site 2>&1 | grep -qE '^172\.17\.0\.1 '; then
            echo "::error::access log kept a full IP address — nginx.conf and the Impressum disagree"
            exit 1
          fi
          docker rm -f site

      # Bring the real docker-compose.yml up against the image just built. This
      # is the deployment as written — read-only root filesystem, all
      # capabilities dropped, tmpfs for the three paths nginx writes to — and
      # the request comes from another container over the shared network by
      # container name, which is exactly how Nginx Proxy Manager reaches it.
      - name: Verify docker-compose.yml
        run: |
          # Owned by the NPM stack in production; created here so the external
          # network the compose file expects exists.
          docker network create nginx-proxy-manager

          cat > /tmp/ci-override.yml <<'EOF'
          services:
            fohanalyzer-website:
              image: fohanalyzer-site:test
          EOF

          docker compose -f docker-compose.yml -f /tmp/ci-override.yml config -q
          docker compose -f docker-compose.yml -f /tmp/ci-override.yml up -d

          probe() { docker run --rm --network nginx-proxy-manager curlimages/curl:8.11.1 "$@"; }
          for _ in $(seq 1 30); do
            probe -fsS http://fohanalyzer-website:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          probe -fsS http://fohanalyzer-website:8080/           > /dev/null
          probe -fsS http://fohanalyzer-website:8080/impressum  > /dev/null

          # A read-only root that nginx silently coped with by not logging would
          # pass the checks above; confirm it is genuinely read-only.
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' fohanalyzer-website)" = "true"
          test "$(docker inspect -f '{{.HostConfig.CapDrop}}' fohanalyzer-website)" = "[ALL]"

          docker compose -f docker-compose.yml -f /tmp/ci-override.yml logs
          docker compose -f docker-compose.yml -f /tmp/ci-override.yml down
          docker network rm nginx-proxy-manager

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
