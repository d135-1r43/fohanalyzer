# -----------------------------------------------------------------------------
# Server block for the FOHanalyzer site.
#
# Installed at /etc/nginx/conf.d/default.conf. The base image is
# nginx-unprivileged, so this listens on 8080 and runs as a non-root user;
# whatever terminates TLS in front of it should proxy to that port.
#
# One rule to know before editing: `add_header` does not merge across levels.
# A single add_header inside a location block discards *every* add_header
# inherited from the server, so the security headers below would silently
# vanish for anything that location serves. That is why cache policy here is
# expressed with `expires`, which is a separate directive and leaves the
# inherited headers alone — and why there is not one add_header in any
# location. If you ever need one, you must repeat the whole block with it.
# -----------------------------------------------------------------------------

server {
	listen       8080;
	listen       [::]:8080;
	server_name  _;

	root  /usr/share/nginx/html;
	index index.html;

	charset       utf-8;
	server_tokens off;

	# -- compression ----------------------------------------------------------
	# WOFF2 and PNG are already compressed; the rest is text and gzips to
	# roughly a quarter of its size.
	gzip              on;
	gzip_vary         on;
	gzip_comp_level   6;
	gzip_min_length   512;
	gzip_proxied      any;
	gzip_types        text/plain text/css text/xml
	                  application/javascript application/json
	                  image/svg+xml application/manifest+json;

	# -- security headers -----------------------------------------------------
	# The site is static: no forms, no third-party requests, no inline script
	# and no inline style. So the policy can be 'self' throughout — there is
	# nothing to loosen it for. Keep it that way; a style attribute added to a
	# page would quietly stop being applied.
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
	add_header X-Content-Type-Options    "nosniff"                         always;
	add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
	add_header X-Frame-Options           "DENY"                            always;
	add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

	# HSTS is deliberately left to whatever terminates TLS: setting it here
	# would be a promise this container cannot keep when reached over plain
	# http, and getting it wrong locks clients out of the domain for a year.

	# -- caching --------------------------------------------------------------
	# Asset filenames are not content-hashed, so nothing can be immutable. A
	# week is long enough to matter and short enough that a deploy is picked
	# up without anyone being told to clear a cache.
	location /assets/ {
		expires 7d;
		access_log off;
		try_files $uri =404;
	}

	# The fonts are the one thing that genuinely never changes; if one is ever
	# re-subset, give it a new filename rather than shortening this.
	location /assets/fonts/ {
		expires 30d;
		access_log off;
		try_files $uri =404;
	}

	# HTML is revalidated every time, so a deploy is live immediately.
	# `expires -1` is nginx's spelling of Cache-Control: no-cache.
	#
	# The root is matched exactly rather than left to the index module: with a
	# try_files in the prefix location below, "/" would only reach index.html
	# by way of a directory redirect, and naming the file is clearer.
	location = / {
		expires -1;
		try_files /index.html =404;
	}

	location ~* \.html$ {
		expires -1;
		try_files $uri =404;
	}

	# -- routing --------------------------------------------------------------
	# /contribute resolves to contribute.html, so the extensionless URL and
	# the filename both work rather than one of them 404ing.
	location / {
		expires -1;
		try_files $uri $uri.html $uri/ =404;
	}

	error_page 404 /404.html;
	location = /404.html {
		internal;
		expires -1;
	}

	# -- health ---------------------------------------------------------------
	# For the container health check and any load balancer in front of it.
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# Dotfiles are never content.
	location ~ /\. {
		deny all;
	}
}
