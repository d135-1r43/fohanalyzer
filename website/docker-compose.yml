# The site, joined to the network Nginx Proxy Manager already runs on.
#
#   docker compose pull && docker compose up -d
#
# There is deliberately no `ports:` mapping. Nginx Proxy Manager reaches this
# container over the shared Docker network, so publishing a host port would add
# a second, unproxied way in — bypassing the TLS and access rules configured in
# NPM. Point the proxy host at the container instead:
#
#   Forward Hostname / IP   fohanalyzer-website
#   Forward Port            8080
#   Scheme                  http
#
# Enable "Websockets Support" if you like; the site does not use them. Do enable
# "Block Common Exploits" and request the certificate in NPM — TLS and HSTS are
# its job, which is why nginx.conf sets neither.

services:
  fohanalyzer-website:
    image: ghcr.io/d135-1r43/fohanalyzer-website:${FOH_TAG:-latest}
    container_name: fohanalyzer-website
    restart: unless-stopped

    # Documentation only — `expose` publishes nothing to the host. The base
    # image is nginx-unprivileged, so this is 8080 and not 80.
    expose:
      - "8080"

    networks:
      - nginx-proxy-manager

    # The image serves static files and writes nothing it needs to keep, so the
    # root filesystem is mounted read-only and the three paths nginx does write
    # to are tmpfs. nginx-unprivileged puts its pid in /tmp rather than /var/run,
    # which is what lets this work without any capabilities at all.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # The image's own HEALTHCHECK curls /healthz; these only set how patiently
    # Compose waits for it.
    healthcheck:
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    # Access logs go to stdout. Cap them so a long-running container cannot
    # quietly fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created and owned by the Nginx Proxy Manager stack, not by this one:
  #   docker network create nginx-proxy-manager
  nginx-proxy-manager:
    external: true
